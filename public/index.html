<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC2026">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#C9A84C">
<title>WC2026 Family Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C96A;--gold-dim:#8B6F35;--black:#0A0A0A;--surface:#111111;--surface-2:#1A1A1A;--surface-3:#242424;--border:rgba(201,168,76,0.2);--border-bright:rgba(201,168,76,0.5);--text:#F0EDE6;--text-dim:#8A8680;--green:#27AE60;--blue:#2980B9;--red:#C0392B;}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.header-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;background:linear-gradient(135deg,#E8C96A,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-right{display:flex;align-items:center;gap:8px;}
.admin-badge{background:linear-gradient(135deg,#C9A84C,#8B6F35);color:var(--black);font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:4px;font-weight:700;}
.user-badge{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;cursor:pointer;}
.user-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--black);}
.user-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;}
.nav-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:90;}
.nav-tab{flex:1;padding:13px 4px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;white-space:nowrap;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.page-hero{background:linear-gradient(180deg,rgba(201,168,76,0.07) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.page-hero-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:2px;}
.page-hero-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;}
.page-hero-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.action-btn{background:linear-gradient(135deg,#C9A84C,#8B6F35);border:none;border-radius:10px;padding:10px 20px;color:var(--black);font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,0.25);white-space:nowrap;}
.filter-wrap{border-bottom:1px solid rgba(201,168,76,0.1);position:relative;background:var(--surface-2);}
.filter-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:100%;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--gold);}
.filter-arrow.left{left:0;background:linear-gradient(90deg,var(--surface-2) 60%,transparent);}
.filter-arrow.right{right:0;background:linear-gradient(270deg,var(--surface-2) 60%,transparent);}
.filter-arrow.hidden{opacity:0;pointer-events:none;}
.group-filter{padding:10px 36px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;}
.group-filter::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;background:var(--surface-3);border:1px solid rgba(201,168,76,0.15);border-radius:20px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--text-dim);cursor:pointer;transition:all 0.15s;text-transform:uppercase;}
.filter-btn.active{background:rgba(201,168,76,0.15);border-color:var(--gold);color:var(--gold);}
.groups-container{padding:14px;padding-bottom:100px;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(201,168,76,0.04);border-bottom:1px solid rgba(201,168,76,0.1);}
.group-label{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);}
.group-positions{display:flex;gap:4px;}
.pos-badge{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:10px;text-transform:uppercase;font-weight:700;}
.pos-1st{background:rgba(201,168,76,0.2);color:var(--gold);}
.pos-2nd{background:rgba(41,128,185,0.2);color:#5DADE2;}
.pos-3rd{background:rgba(39,174,96,0.15);color:var(--green);}
.pos-4th{background:rgba(255,255,255,0.05);color:var(--text-dim);}
.team-list{padding:8px;display:flex;flex-direction:column;gap:6px;}
.team-card{border-radius:12px;height:68px;display:flex;align-items:stretch;cursor:grab;border:1px solid rgba(255,255,255,0.1);user-select:none;touch-action:none;-webkit-user-select:none;overflow:hidden;transition:opacity 0.15s;}
.team-card.dragging{opacity:0.4;}
.card-flag-panel{width:90px;flex-shrink:0;position:relative;overflow:hidden;}
.card-flag-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.card-flag-panel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 60%,rgba(0,0,0,0.35) 100%);}
.card-color-strip{width:4px;flex-shrink:0;}
.card-body{flex:1;min-width:0;display:flex;align-items:center;padding:0 10px;gap:8px;}
.card-handle{padding:0 4px;color:rgba(255,255,255,0.2);font-size:14px;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.team-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:1px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-sub{display:flex;align-items:center;gap:6px;margin-top:2px;}
.team-ranking{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;}
.card-pos{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;}
.third-rank-card{border-radius:12px;height:62px;display:flex;align-items:stretch;cursor:grab;border:1px solid rgba(255,255,255,0.1);overflow:hidden;user-select:none;touch-action:none;-webkit-user-select:none;transition:opacity 0.15s;}
.third-rank-card.dragging{opacity:0.4;}
.trcard-rank{width:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;background:rgba(0,0,0,0.3);border-right:1px solid rgba(255,255,255,0.08);}
.trcard-rank.q{color:var(--green);}
.trcard-rank.nq{color:rgba(255,255,255,0.25);}
.trcard-flag{width:72px;flex-shrink:0;position:relative;overflow:hidden;}
.trcard-flag img{width:100%;height:100%;object-fit:cover;}
.trcard-strip{width:3px;flex-shrink:0;}
.trcard-body{flex:1;min-width:0;display:flex;align-items:center;padding:0 10px;gap:8px;}
.trcard-info{flex:1;min-width:0;}
.trcard-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trcard-meta{font-size:10px;margin-top:2px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
.trcard-handle{padding:0 6px;color:rgba(255,255,255,0.2);font-size:14px;}
.qualify-badge{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;padding:3px 7px;border-radius:4px;text-transform:uppercase;}
.qualify-badge.yes{background:rgba(39,174,96,0.15);color:var(--green);}
.qualify-badge.no{background:rgba(255,255,255,0.05);color:var(--text-dim);}
.divider-8{height:2px;background:rgba(39,174,96,0.3);border-radius:1px;margin:6px 0;position:relative;}
.divider-8::before{content:'TOP 8 ADVANCE';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--black);padding:0 8px;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:3px;color:var(--green);white-space:nowrap;}
.versus-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.versus-header{padding:8px 14px;background:rgba(201,168,76,0.04);border-bottom:1px solid rgba(201,168,76,0.08);display:flex;align-items:center;justify-content:space-between;}
.versus-match-id{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;color:var(--text-dim);}
.pts-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:4px;background:rgba(201,168,76,0.12);color:var(--gold);}
.versus-body{display:flex;align-items:stretch;min-height:80px;}
.versus-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;cursor:pointer;transition:background 0.15s;gap:6px;}
.versus-side:active{background:rgba(201,168,76,0.08);}
.versus-side.picked{background:rgba(201,168,76,0.12);}
.versus-side.tbd{cursor:default;opacity:0.5;}
.versus-divider{width:1px;background:rgba(255,255,255,0.06);flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.versus-divider::after{content:'VS';position:absolute;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-dim);background:var(--surface);padding:4px 0;writing-mode:vertical-rl;}
.vs-flag{width:52px;height:34px;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.4);}
.vs-flag img{width:100%;height:100%;object-fit:cover;}
.vs-flag-ph{width:52px;height:34px;border-radius:5px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.vs-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.5px;text-align:center;line-height:1.2;}
.vs-sub{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.4);text-align:center;}
.pick-ind{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;}
.versus-side.picked .pick-ind{background:var(--gold);border-color:var(--gold);color:var(--black);}
.round-tabs{display:flex;padding:10px 12px;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);border-bottom:1px solid var(--border);}
.round-tabs::-webkit-scrollbar{display:none;}
.round-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--text-dim);transition:all 0.15s;}
.round-tab.active{background:rgba(201,168,76,0.15);border-color:var(--gold);color:var(--gold);}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.quad-btn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 12px;cursor:pointer;text-align:center;transition:all 0.2s;}
.quad-btn.active,.quad-btn:active{border-color:var(--gold);background:rgba(201,168,76,0.07);}
.quad-btn.done{border-color:rgba(39,174,96,0.4);}
.quad-num{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;color:var(--text-dim);margin-bottom:3px;}
.quad-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;}
.quad-prog{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;margin-top:4px;}
.quad-prog.done{color:var(--green);}
.quad-prog.partial{color:var(--gold);}
.lb-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.lb-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s;}
.lb-row:last-child{border-bottom:none;}
.lb-row:active{background:rgba(201,168,76,0.06);}
.lb-row.you{background:rgba(201,168,76,0.06);}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:22px;width:32px;flex-shrink:0;}
.lb-rank.r1{color:var(--gold);}
.lb-rank.r2{color:#C0C0C0;}
.lb-rank.r3{color:#CD7F32;}
.lb-rank.rn{color:var(--text-dim);}
.lb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--black);margin-right:10px;flex-shrink:0;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.you-tag{font-size:9px;letter-spacing:2px;color:var(--gold);background:rgba(201,168,76,0.15);padding:2px 5px;border-radius:3px;}
.lb-sub{font-size:10px;color:var(--text-dim);margin-top:1px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
.lb-score{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--gold-light);text-align:right;}
.lb-score-sub{font-size:10px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-align:right;}
.home-hero{background:linear-gradient(180deg,rgba(201,168,76,0.1) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:24px 16px 20px;text-align:center;position:relative;overflow:hidden;}
.home-hero::before{content:'2026';position:absolute;font-family:'Bebas Neue',sans-serif;font-size:120px;color:rgba(201,168,76,0.04);top:50%;left:50%;transform:translate(-50%,-50%);letter-spacing:8px;pointer-events:none;}
.hero-trophy{font-size:52px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin:8px 0 2px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;margin-bottom:12px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.status-text{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.phase-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all 0.2s;}
.phase-card:active{transform:scale(0.97);}
.phase-icon{font-size:28px;margin-bottom:10px;}
.phase-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}
.phase-meta{font-size:11px;color:var(--text-dim);}
.phase-status{display:inline-block;margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:4px;text-transform:uppercase;}
.phase-status.open{background:rgba(39,174,96,0.15);color:var(--green);}
.phase-status.locked-s{background:rgba(255,255,255,0.05);color:var(--text-dim);}
.section-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin:16px 0 8px 2px;}
.section-lbl:first-child{margin-top:0;}
.info-hint{background:var(--surface-2);border:1px solid rgba(201,168,76,0.15);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:11px;color:var(--text-dim);line-height:1.6;}
.info-hint strong{color:var(--gold-light);}
.admin-panel{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.25);border-radius:14px;padding:16px;margin-bottom:14px;}
.admin-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.admin-btn{background:var(--surface-2);border:1px solid var(--border-bright);border-radius:8px;padding:10px 12px;color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;text-align:center;}
.admin-btn:active{background:rgba(201,168,76,0.12);}
.admin-btn.full{grid-column:1/-1;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:flex;flex-direction:column;justify-content:flex-end;}
.modal-sheet{background:#1A1A1A;border-radius:20px 20px 0 0;border:1px solid rgba(201,168,76,0.2);max-height:88vh;display:flex;flex-direction:column;}
.modal-header{padding:18px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);}
.modal-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text-dim);border:none;flex-shrink:0;}
.modal-body{overflow-y:auto;padding:16px;flex:1;}
.modal-btn-row{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.modal-btn{flex:1;padding:13px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;cursor:pointer;border:none;}
.modal-btn.primary{background:linear-gradient(135deg,#C9A84C,#8B6F35);color:var(--black);}
.modal-btn.secondary{background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border);}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.12) 0%,transparent 70%);}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px;background:linear-gradient(135deg,#E8C96A,#C9A84C,#8B6F35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1;margin-bottom:4px;}
.login-subtitle{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:6px;color:var(--text-dim);text-transform:uppercase;text-align:center;margin-bottom:40px;}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 22px;}
.login-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block;}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.name-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;text-align:center;transition:all 0.15s;}
.name-chip:active,.name-chip.active{background:rgba(201,168,76,0.12);border-color:var(--gold);color:var(--gold-light);}
.name-chip.admin-chip{border-color:rgba(201,168,76,0.3);}
.pin-display{display:flex;justify-content:center;gap:10px;margin:16px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-bright);transition:all 0.15s;}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.pin-key{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text);transition:all 0.1s;}
.pin-key:active{background:rgba(201,168,76,0.15);border-color:var(--gold);}
.pin-error{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--red);text-align:center;margin-bottom:10px;min-height:18px;}
.breakdown-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.breakdown-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.breakdown-row:last-child{border-bottom:none;}
.result-group-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.result-team-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04);gap:10px;}
.result-team-row:last-child{border-bottom:none;}
.result-flag{width:36px;height:24px;border-radius:3px;overflow:hidden;flex-shrink:0;}
.result-flag img{width:100%;height:100%;object-fit:cover;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 8px 10px;cursor:pointer;gap:3px;}
.bnav-icon{font-size:20px;}
.bnav-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);}
.bottom-nav-item.active .bnav-label{color:var(--gold);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-bright);border-radius:10px;padding:10px 20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold);z-index:300;opacity:0;transition:opacity 0.3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;}
.content{padding:14px 14px 100px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.screen{animation:fadeIn 0.25s ease;}
</style>
</head>

async function checkPin(name, pin) {

  try {

    if (!snap.exists()) {
      // First login — save to both Firebase and localStorage
      await setDoc(doc(db,'pins',name), {pin, createdAt:new Date().toISOString()});
      localStorage.setItem(lsKey, pin);
      return true;
    }
    const correct = snap.data().pin === pin;
    if (correct) localStorage.setItem(lsKey, pin); // keep local in sync
    return correct;
  } catch(e) {
    // Firebase unavailable — fall back to localStorage
    const stored = localStorage.getItem(lsKey);
    if (!stored) {
      // First time, no Firebase — set locally
      localStorage.setItem(lsKey, pin);
      return true;
    }
    return stored === pin;
  }
}

function getAnnexCRow(top8groups) {
  const key = [...top8groups].sort().join('');
  return ANNEX_C[key] || null;
}
function getThirdFor(acSlot, preds) {
  const top8 = (preds.thirdsRanking||[]).slice(0,8);
  const ac = getAnnexCRow(top8);
  if (!ac) return null;
  const val = ac[acSlot];
  return val ? (preds.groupPreds?.[val[1]]?.[2] || null) : null;
}
function resolveSlot(slot, preds) {
  const gp = preds.groupPreds || {};
  if (slot.type==='winner') return gp[slot.group]?.[0]||null;
  if (slot.type==='runner') return gp[slot.group]?.[1]||null;
  if (slot.type==='third_slot') return getThirdFor(slot.acSlot, preds);
  return null;
}
function getSlotLabel(slot, preds) {
  if (slot.type==='winner') return `W Grp ${slot.group}`;
  if (slot.type==='runner') return `2nd Grp ${slot.group}`;
  if (slot.type==='third_slot') {
    const ac = getAnnexCRow((preds.thirdsRanking||[]).slice(0,8));
    if (ac) { const v=ac[slot.acSlot]; return `3rd Grp ${v?v[1]:'?'}`; }
    return `3rd (${slot.acSlot})`;
  }
  return 'TBD';
}
function getPrevRound(k) { return k==='r16'?'r32':k==='qf'?'r16':k==='sf'?'qf':'sf'; }

// ── SCORING ENGINE ──
function scorePlayer(preds) {
  const bd = {groups:{items:[],total:0},knockout:{items:[],total:0},total:0};
  if (!preds || !results.groups) return bd;
  const ag = results.groups;
  const qt = results.qualifyingThirds||[];
  const aQ3 = new Set(qt.map(g=>ag[g]?.[2]).filter(Boolean));
  const pQ3 = new Set((preds.thirdsRanking||[]).slice(0,8).map(g=>preds.groupPreds?.[g]?.[2]).filter(Boolean));

  Object.keys(ag).forEach(g => {
    const ac=ag[g], pr=preds.groupPreds?.[g];
    if (!pr||!ac) return;
    const aT2=new Set([ac[0],ac[1]]);
    let gp=0, allOk=true;

    [0,1].forEach(i=>{
      const pt=pr[i],at=ac[i];
      if(aT2.has(pt)){
        bd.groups.items.push({label:`${TEAMS[pt]?.name||pt} qualifies (G${g})`,pts:PTS.QUALIFIES});gp+=PTS.QUALIFIES;
        if(pt===at){bd.groups.items.push({label:`${TEAMS[pt]?.name||pt} exact ${i===0?'1st':'2nd'} (G${g})`,pts:PTS.EXACT_POSITION});gp+=PTS.EXACT_POSITION;}
        else allOk=false;
      } else allOk=false;
    });

    const p3=pr[2],a3=ac[2];
    if(aQ3.has(p3)){
      bd.groups.items.push({label:`${TEAMS[p3]?.name||p3} qualifies top-8 3rd (G${g})`,pts:PTS.QUALIFIES});gp+=PTS.QUALIFIES;
      if(pQ3.has(p3)){bd.groups.items.push({label:`G${g} produces qualifying 3rd`,pts:PTS.THIRD_GROUP_ID});gp+=PTS.THIRD_GROUP_ID;}
      if(p3===a3){bd.groups.items.push({label:`${TEAMS[p3]?.name||p3} exact 3rd (G${g})`,pts:PTS.EXACT_POSITION});gp+=PTS.EXACT_POSITION;}
      else allOk=false;
    } else if(aT2.has(p3)){
      bd.groups.items.push({label:`${TEAMS[p3]?.name||p3} pred 3rd→top 2 (G${g})`,pts:PTS.QUALIFIES});gp+=PTS.QUALIFIES;allOk=false;
    } else allOk=false;

    const p4=pr[3],a4=ac[3];
    if(p4===a4){bd.groups.items.push({label:`${TEAMS[p4]?.name||p4} exact 4th (G${g})`,pts:PTS.EXACT_POSITION});gp+=PTS.EXACT_POSITION;}
    else allOk=false;

    if(allOk){bd.groups.items.push({label:`Full group correct (G${g})`,pts:PTS.FULL_GROUP});gp+=PTS.FULL_GROUP;}
    bd.groups.total+=gp;
  });

  const tier=preds.bracketTier||'pre';
  const tp=PTS.KO[tier]||PTS.KO.pre;
  [['r32','r32'],['r16','r16'],['qf','qf'],['sf','sf'],['final','final']].forEach(([rk,pk])=>{
    const pts=tp[pk]; if(!pts) return;
    const ar=results.ko?.[rk]||{}, pr=preds.koPicks?.[rk]||{};
    Object.entries(ar).forEach(([mid,aw])=>{
      if(pr[mid]===aw){bd.knockout.items.push({label:`${rk.toUpperCase()} ${mid}: ${TEAMS[aw]?.name||aw}`,pts});bd.knockout.total+=pts;}
    });
  });
  bd.total=bd.groups.total+bd.knockout.total;
  return bd;
}

function recomputeAllScores() {
  allScores = FAMILY_MEMBERS.map(fm => {
    const preds = allPredictions[fm.name]||null;
    return {...fm, breakdown:scorePlayer(preds), hasPreds:!!preds};
  }).sort((a,b)=>b.breakdown.total-a.breakdown.total);
}

// ── KNOCKOUT PICKS ──
let pendingKoPick=null;
function pickWinner(matchId,roundKey,teamId){
  const existing=myPreds.koPicks[roundKey]?.[matchId];
  if(existing===teamId){
    delete myPreds.koPicks[roundKey][matchId];
    clearDownstream(matchId,roundKey,teamId);
    rerender();return;
  }
  if(existing&&existing!==teamId){
    pendingKoPick={matchId,roundKey,teamId,old:existing};
    showWarnModal('Change Pick?','Changing this pick will clear downstream predictions.',()=>{
      if(!myPreds.koPicks[pendingKoPick.roundKey])myPreds.koPicks[pendingKoPick.roundKey]={};
      myPreds.koPicks[pendingKoPick.roundKey][pendingKoPick.matchId]=pendingKoPick.teamId;
      clearDownstream(pendingKoPick.matchId,pendingKoPick.roundKey,pendingKoPick.old);
      pendingKoPick=null;rerender();
    });
    return;
  }
  if(!myPreds.koPicks[roundKey])myPreds.koPicks[roundKey]={};
  myPreds.koPicks[roundKey][matchId]=teamId;
  rerender();showToast('✓ Pick saved');
}
window.pickWinner=pickWinner;

function clearDownstream(matchId,roundKey,oldTeam){
  const allM=[...R32_DEFS,...R16_DEFS,...QF_DEFS,...SF_DEFS,FINAL_DEF];
  allM.forEach(m=>{
    if(m.from&&m.from.includes(matchId)){
      const rk=m.id.startsWith('R16')?'r16':m.id.startsWith('QF')?'qf':m.id.startsWith('SF')?'sf':m.id==='FINAL'?'final':'r32';
      if(!oldTeam||myPreds.koPicks[rk]?.[m.id]===oldTeam){
        const prev=myPreds.koPicks[rk]?.[m.id];
        if(myPreds.koPicks[rk])delete myPreds.koPicks[rk][m.id];
        if(prev)clearDownstream(m.id,rk,prev);
      }
    }
  });
}

function lum(c){if(!c||c.length<7)return 0.5;const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255;return 0.299*r+0.587*g+0.114*b;}

function renderR32View(){
  const qm=R32_DEFS.filter(m=>m.quad===bracketQuad);
  const r16p=R16_DEFS.filter(m=>m.quad===bracketQuad);
  let html=`<div class="quad-grid">`;
  for(let q=1;q<=4;q++){
    const dm=R32_DEFS.filter(m=>m.quad===q);
    const done=dm.filter(m=>myPreds.koPicks?.r32?.[m.id]).length;
    html+=`<div class="quad-btn ${bracketQuad===q?'active':''} ${done===4?'done':''}" onclick="setBracketQuad(${q})">
      <div class="quad-num">PATH ${q}</div><div class="quad-label">→${q<=2?'SF1':'SF2'}</div>
      <div class="quad-prog ${done===4?'done':done>0?'partial':''}">${done===4?'✓ Done':`${done}/4`}</div>
    </div>`;
  }
  html+=`</div><div class="section-lbl">Round of 32 — Path ${bracketQuad}</div>`;
  const p1=qm.slice(0,2),p2=qm.slice(2,4);
  p1.forEach(m=>{html+=renderVCard(m,'r32');});
  if(r16p[0])html+=renderR16Preview(r16p[0],p1);
  html+=`<div class="section-lbl" style="margin-top:18px;">Path ${bracketQuad} (cont.)</div>`;
  p2.forEach(m=>{html+=renderVCard(m,'r32');});
  if(r16p[1])html+=renderR16Preview(r16p[1],p2);
  return html;
}

function renderVCard(match,rk){

  const w=myPreds.koPicks?.[rk]?.[match.id];
  return `<div class="versus-card">
    <div class="versus-header"><div class="versus-match-id">${match.id}</div><div class="pts-badge">${match.pts.toLocaleString()} pts</div></div>
    <div class="versus-body">
      ${renderVSide(match.id,rk,tId,tT,getSlotLabel(match.top,myPreds),w)}
      <div class="versus-divider"></div>
      ${renderVSide(match.id,rk,bId,bT,getSlotLabel(match.bot,myPreds),w)}
    </div>
  </div>`;
}

function renderStandingsPage(){

      :allScores.map((p,i)=>{

          const tierL={pre:'Pre-Tournament',groups:'After Groups',after_r32:'After R32'}[p.bracketTier||'pre']||'Pre-Tournament';
          return `<div class="lb-row ${isY?'you':''}" onclick="openPlayerModal('${p.name}')">

            <div class="lb-info"><div class="lb-name">${p.name}${isY?'<span class="you-tag">YOU</span>':''}</div><div class="lb-sub">${tierL} bracket</div></div>
            <div><div class="lb-score">${p.breakdown.total.toLocaleString()}</div><div class="lb-score-sub">${p.breakdown.groups.total.toLocaleString()} + ${p.breakdown.knockout.total.toLocaleString()}</div></div>
          </div>`;
        }).join('')}
  </div></div>`;
}

function openPlayerModal(name){
  const player=allScores.find(p=>p.name===name);
  if(!player)return;
  const rank=allScores.findIndex(p=>p.name===name)+1;
  const isY=name===currentUser.name;
  const preds=allPredictions[name]||null;
  const bd=preds?scorePlayer(preds):{groups:{items:[],total:0},knockout:{items:[],total:0},total:0};
  const canSee=results.predictionsLocked||isY;
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-sheet">
    <div class="modal-header" style="display:flex;align-items:center;justify-content:space-between;">
      <div><div class="modal-title">#${rank} ${name}${isY?' (You)':''}</div><div class="modal-sub">${player.breakdown.total.toLocaleString()} pts</div></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
    </div>
    <div class="modal-body">${canSee&&results.groups?renderBreakdownPanel(bd,name):`<div style="text-align:center;padding:32px;">
      <div style="font-size:48px;margin-bottom:12px;">${results.groups?'🔒':'⏳'}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:8px;">${results.groups?'Still Open':'Waiting for Results'}</div>
      <div style="font-size:13px;color:var(--text-dim);">${player.breakdown.total.toLocaleString()} pts so far</div>
    </div>`}</div>
  </div>`;
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  document.body.appendChild(ov);
}
window.openPlayerModal=openPlayerModal;

// ─── LIVE RESULTS API POLLING ───
let pollInterval = null;
let lastResultsHash = '';

async function fetchLiveResults() {
  try {
    // Call our Netlify function proxy
    const res = await fetch('/api/results');
    if (!res.ok) return;
    const data = await res.json();
    if (data.error) return;

    // Hash the response to avoid unnecessary rerenders
    const hash = JSON.stringify(data);
    if (hash === lastResultsHash) return;
    lastResultsHash = hash;

    // Merge into results — keep predictionsLocked from Firestore
    const wasLocked = results.predictionsLocked;
    results = {
      ...results,
      groups: data.groups || results.groups,
      qualifyingThirds: data.qualifyingThirds || results.qualifyingThirds,
      ko: data.ko || results.ko,
      currentStage: data.currentStage || results.currentStage,
      lastUpdated: data.lastUpdated,
      source: data.source,
      predictionsLocked: wasLocked,
    };

    // Also push to Firestore so offline users get it too (admin only)
    if (currentUser?.isAdmin) {
      try {
        await setDoc(doc(db, 'results', 'current'), {
          ...results,
          updatedAt: new Date().toISOString(),
        });
      } catch(e) {}
    }

    recomputeAllScores();
    rerender();

    // Update the last-refreshed indicator
    const el = document.getElementById('lastUpdatedEl');
    if (el) {
      const t = new Date(data.lastUpdated);
      el.textContent = 'Updated ' + t.toLocaleTimeString();
    }

  } catch(e) {
    console.warn('Results fetch failed:', e.message);
  }
}

function startPolling() {
  fetchLiveResults(); // immediate first fetch
  // Poll every 60s normally, every 30s if a match is live
  pollInterval = setInterval(fetchLiveResults, 60000);
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

// ─── INIT ───
async function init() {
  // Try auto-login from localStorage
  const saved = localStorage.getItem('wc2026_user');
  if (saved && FAMILY_MEMBERS.find(f=>f.name===saved)) {
    await loginAs(saved);
  } else {
    rerender();
  }
  // Start polling for live results
  startPolling();
}

// Start the app
init();

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
